# Phase 6 task 5: BM25 on the romanized (Uroman) index with the romanized normalization key on
# both the passages and the raw romanized queries (docs/plans/06-doc-side-normalization.md).
# Run: python -m scripts.run_baseline --config configs/docside_bm25_romindex_norm.yaml [--split tune]
experiment: docside_bm25_romindex_norm_hi
phase: 6
lang: hi
seed: 42                      # BM25 is deterministic; kept for the config convention
method: bm25_romindex_norm    # run names: hi_bm25_romindex_norm_{query_set}_{split}

index_dir: data/indexes/hi_roman_norm   # built by configs/index_bm25_hi_roman_norm.yaml
roman_normalize: [ch, sh, w_v, ph_f, anusvara, long_vowels, doubled, ei_e, eh_ah, schwa, final_a]
                              # chosen on tune by configs/tune_docside_roman_normalization_hi.yaml
bm25:
  k1: 1.2                     # tuned on tune with the natural queries by configs/tune_bm25_hi_roman_norm.yaml
  b: 0.3
  floor_idf: true
top_k: 1000

splits: [tune, test]          # test is run at the end of the phase (task 8)
qrels: data/processed/{split}_qrels.tsv
query_sets:                   # raw romanized queries; the searcher applies the key
  roman_natural: data/romanized/{split}_queries_roman_natural.tsv
  roman_rule: data/romanized/{split}_queries_roman_rule.tsv
  roman_human: data/romanized/{split}_queries_roman_human_a.tsv   # test only (50 queries)

output:
  run_dir: results/runs
  per_query_dir: results/per_query
