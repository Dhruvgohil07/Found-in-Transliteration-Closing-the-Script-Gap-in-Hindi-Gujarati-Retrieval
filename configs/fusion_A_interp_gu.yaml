# Phase 10 task 4: hybrid A on Gujarati, min-max score interpolation (docs/plans/10-gujarati.md),
# as configs/fusion_A_interp.yaml (Phase 8): best lexical (top-3 back-transliteration, normalized
# native BM25) + off-the-shelf e5 with top-1 back-transliteration.
# Run: python -m scripts.run_fusion --config configs/fusion_A_interp_gu.yaml [--split tune]
experiment: fusion_A_interp_gu
phase: 10
lang: gu
seed: 42                      # fusion is deterministic; kept for the config convention
method: fusion_A_interp       # run names: gu_fusion_A_interp_{query_set}_{split}

components:                   # lexical first; {set} = the fused query set (scripts/run_fusion.py)
  - configs/docside_bt3_norm_bm25_gu.yaml
  - {config: configs/backtranslit_top1_dense_gu.yaml, query_set: "{set}_bt1"}
fusion:
  method: interp
  alpha: 0.5                  # weight of the lexical run, chosen on tune by natural nDCG@10
                              # (configs/tune_fusion_gu.yaml, results/tuning/tune_fusion_gu.csv)
top_k: 1000

compare_with:                 # printed next to the fused run, not fused
  - {config: configs/backtranslit_top1_dense_gu.yaml, query_set: "{set}_bt1"}
metric: ndcg@10

splits: [tune, test]
qrels: data/processed/gu/{split}_qrels.tsv
query_sets:
  roman_natural: data/romanized/gu/{split}_queries_roman_natural.tsv
  roman_rule: data/romanized/gu/{split}_queries_roman_rule.tsv

output:
  run_dir: results/runs
  per_query_dir: results/per_query
