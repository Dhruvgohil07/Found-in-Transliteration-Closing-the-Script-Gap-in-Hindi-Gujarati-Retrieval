# Phase 10 task 4: BM25 with weighted top-k back-transliterated Gujarati queries
# (docs/plans/10-gujarati.md), as configs/backtranslit_topk_bm25.yaml (Phase 5).
# Run: python -m scripts.run_baseline --config configs/backtranslit_topk_bm25_gu.yaml
experiment: backtranslit_topk_bm25_gu
phase: 10
lang: gu
seed: 42                      # BM25 is deterministic; kept for the config convention
method: bm25_bt3              # run names: gu_bm25_bt3_{query_set}_{split}

index_dir: data/indexes/gu_native   # the Gujarati BM25 baseline settings
bm25:
  k1: 1.5
  b: 0.6
  floor_idf: true
top_k: 1000

backtranslit:
  candidates_file: data/backtranslit/candidates_gu.tsv
  k: 3                        # chosen on tune by configs/tune_backtranslit_k_gu.yaml (best for both
                              # query sets; Hindi chose 5)

splits: [tune, test]
qrels: data/processed/gu/{split}_qrels.tsv
query_sets:                   # romanized queries: the searcher builds the weighted queries itself
  roman_natural: data/romanized/gu/{split}_queries_roman_natural.tsv
  roman_rule: data/romanized/gu/{split}_queries_roman_rule.tsv

output:
  run_dir: results/runs
  per_query_dir: results/per_query
