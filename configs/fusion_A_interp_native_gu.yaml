# Phase 10 task 4: hybrid A with native Gujarati queries (docs/plans/10-gujarati.md), as
# configs/fusion_A_interp_native.yaml (Phase 9): normalized native BM25 + off-the-shelf e5, same alpha.
# Run: python -m scripts.run_fusion --config configs/fusion_A_interp_native_gu.yaml
experiment: fusion_A_interp_native_gu
phase: 10
lang: gu
seed: 42                      # fusion is deterministic; kept for the config convention
method: fusion_A_interp       # same system as configs/fusion_A_interp_gu.yaml: gu_fusion_A_interp_native_{split}

components:                   # lexical first
  - configs/docside_bm25_norm_gu.yaml    # normalized native index, native query
  - configs/baseline_dense_gu.yaml       # off-the-shelf e5, native query
fusion:
  method: interp
  alpha: 0.5                  # weight of the lexical run, as chosen for Gujarati hybrid A (nothing tuned here)
top_k: 1000

compare_with:                 # printed next to the fused run, not fused
  - configs/baseline_dense_gu.yaml       # dense native: the strongest native baseline
metric: ndcg@10

splits: [tune, test]
qrels: data/processed/gu/{split}_qrels.tsv
query_sets:
  native: data/processed/gu/{split}_queries.tsv

output:
  run_dir: results/runs
  per_query_dir: results/per_query
