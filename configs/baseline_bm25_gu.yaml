# Phase 10 task 4: BM25 baseline on Gujarati, native vs romanized queries (the gap)
# (docs/plans/10-gujarati.md); same setup as configs/baseline_bm25.yaml (Phase 4).
# Run: python -m scripts.run_baseline --config configs/baseline_bm25_gu.yaml
experiment: baseline_bm25_gu
phase: 10
lang: gu
seed: 42                      # BM25 is deterministic; kept for the config convention
method: bm25                  # run names: gu_bm25_{query_set}_{split}

index_dir: data/indexes/gu_native   # built by configs/index_bm25_gu.yaml
bm25:
  k1: 1.5                     # tuned on Gujarati tune by configs/tune_bm25_gu.yaml (nDCG@10)
  b: 0.6
  floor_idf: true             # drop query terms in > half the passages (IDF floored at 0)
top_k: 1000

splits: [tune, test]
qrels: data/processed/gu/{split}_qrels.tsv
query_sets:
  native: data/processed/gu/{split}_queries.tsv
  roman_natural: data/romanized/gu/{split}_queries_roman_natural.tsv
  roman_rule: data/romanized/gu/{split}_queries_roman_rule.tsv

output:
  run_dir: results/runs
  per_query_dir: results/per_query
