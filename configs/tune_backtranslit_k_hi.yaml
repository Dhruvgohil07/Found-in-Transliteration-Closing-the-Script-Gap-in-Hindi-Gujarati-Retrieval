# Phase 5 step 4: choose k (candidates per word) for the weighted BM25 query, on TUNE only.
# Run: python -m scripts.tune_backtranslit_k --config configs/tune_backtranslit_k_hi.yaml
experiment: tune_backtranslit_k_hi
phase: 5
lang: hi
seed: 42

bm25_config: configs/baseline_bm25.yaml        # index, k1, b, IDF floor, top_k: the Phase 4 baseline
candidates_file: data/backtranslit/candidates_hi.tsv

split: tune
qrels: data/processed/tune_qrels.tsv
query_sets:                   # the human set exists on test only, so it cannot be tuned on
  roman_natural: data/romanized/tune_queries_roman_natural.tsv
  roman_rule: data/romanized/tune_queries_roman_rule.tsv

ks: [1, 3, 5, 7, 10]          # plan: {1, 3, 5}; 7 and 10 added because the first best (5) was at the grid edge.
                              # k = 1 must reproduce the top-1 runs exactly
metric: ndcg@10

output: results/tuning/tune_backtranslit_k_hi.csv   # one row per (query set, k) with all metrics
