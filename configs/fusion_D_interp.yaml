# Phase 8: hybrid D, min-max score interpolation (docs/plans/08-hybrid-fusion.md).
# no transliteration model: romanized 4-gram BM25 + fine-tuned T e5, raw romanized query.
# Run: python -m scripts.run_fusion --config configs/fusion_D_interp.yaml [--split tune]
experiment: fusion_D_interp_hi
phase: 8
lang: hi
seed: 42                      # fusion is deterministic; kept for the config convention
method: fusion_D_interp         # run names: hi_fusion_D_interp_{query_set}_{split}

components:                   # lexical first; {set} = the fused query set (scripts/run_fusion.py)
  - configs/docside_bm25_romindex_ng4.yaml
  - configs/finetuned_dense_T.yaml
fusion:
  method: interp
  alpha: 0.6   # weight of the first (lexical) component
                              # chosen on tune by natural nDCG@10 (configs/tune_fusion_hi.yaml,
                              # results/tuning/tune_fusion_hi.csv)
top_k: 1000

compare_with:                 # printed next to the fused run, not fused
  - {config: configs/backtranslit_top1_dense.yaml, query_set: "{set}_bt1"}   # Phase 5 best single method
metric: ndcg@10

splits: [tune, test]          # test run once, after every choice was made on tune
qrels: data/processed/{split}_qrels.tsv
query_sets:
  roman_natural: data/romanized/{split}_queries_roman_natural.tsv
  roman_rule: data/romanized/{split}_queries_roman_rule.tsv
  roman_human: data/romanized/{split}_queries_roman_human_a.tsv   # test only (50 queries)

output:
  run_dir: results/runs
  per_query_dir: results/per_query
