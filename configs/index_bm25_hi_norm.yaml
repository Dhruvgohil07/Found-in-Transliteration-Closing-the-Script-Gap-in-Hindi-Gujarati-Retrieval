# Phase 6: BM25 index of the native Hindi corpus with the Devanagari normalization key
# (docs/plans/06-doc-side-normalization.md). Rules chosen on tune by
# configs/tune_docside_normalization_hi.yaml (leave-one-out ablation).
# Run: python -m scripts.build_bm25_index --config configs/index_bm25_hi_norm.yaml
experiment: index_bm25_hi_norm
phase: 6
lang: hi
seed: 42                      # indexing is deterministic; kept for the config convention

dataset: miracl/hi            # 506,264 passages (ir_datasets cache)
text: title + text            # src.data.load.full_text
normalize: [chandrabindu, nasal, digits]   # src.data.normalize; recorded in the index's normalization.json
index_dir: data/indexes/hi_native_norm     # git-ignored; rebuild with the command above

tokeniser: utf                # as in the Phase 4 index (configs/index_bm25_hi.yaml)
stemmer: none
stopwords: none
docno_length: 32
