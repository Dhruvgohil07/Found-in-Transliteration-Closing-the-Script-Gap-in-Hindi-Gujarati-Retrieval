# Phase 6: BM25 top-5 back-transliteration (Phase 5) on the normalized native index, with the
# weighted query's terms normalized (docs/plans/06-doc-side-normalization.md).
# Run: python -m scripts.run_baseline --config configs/docside_bt5_norm_bm25.yaml [--split tune]
experiment: docside_bt5_norm_bm25_hi
phase: 6
lang: hi
seed: 42                      # BM25 is deterministic; kept for the config convention
method: bm25_bt5_norm         # run names: hi_bm25_bt5_norm_{query_set}_{split}

index_dir: data/indexes/hi_native_norm    # built by configs/index_bm25_hi_norm.yaml
normalize: [chandrabindu, nasal, digits]  # rules chosen on tune (configs/tune_docside_normalization_hi.yaml)
bm25:
  k1: 1.2                     # re-tuned on tune by configs/tune_bm25_hi_norm.yaml: same as Phase 4
  b: 0.3
  floor_idf: true
top_k: 1000

backtranslit:
  candidates_file: data/backtranslit/candidates_hi.tsv
  k: 5                        # as chosen in Phase 5

splits: [tune, test]          # test is run at the end of the phase (task 8)
qrels: data/processed/{split}_qrels.tsv
query_sets:                   # romanized queries: the searcher builds the weighted queries itself
  roman_natural: data/romanized/{split}_queries_roman_natural.tsv
  roman_rule: data/romanized/{split}_queries_roman_rule.tsv
  roman_human: data/romanized/{split}_queries_roman_human_a.tsv   # test only (50 queries)

output:
  run_dir: results/runs
  per_query_dir: results/per_query
